<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projeto Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="conf.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
          <div class="col-10" style="text-align:center; color:#fff; margin-top:30px"><h3>Marcação de Consultas da Unidade de Saúde</h3></div>
          <div class="col-2"><a href="index.html" class="sair">Sair</a></div>
        </div>
    </div>
    <div class="container">
      <div class="row">
          <div class="col-md-6 offset-md-3 titulo"><h4>Marcação de consultas</h4>
          <p style="color:#adadad">Você pode marcar quantas consultas quiser, contanto que tenha médico disponível na data e horário desejado.</p>
          </div>
      </div>
      <div class="row">
      <div class="col-md-6 offset-md-3">
        <select id="doctor" required>
        <option value="">Médico</option>
        <option value="Dr. João Silva">Clínico Geral</option>
        <option value="Dra. Ila Moraes">Dermatologista</option>
        <option value="Dra. Maria Oliveira">Ginecologista</option>
        <option value="Dr. Carlos Mendes">Urologista</option>
        </select>
        <input type="date" id="data" required>
        <input type="time" id="hora" required>
        <button onclick="adiConsulta()">Marcar</button>
        <div id="marcacao"></div>
      </div>
      </div>
    </div>
    <script src="cdLogada.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
