<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projeto Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="conf.css" rel="stylesheet">
  </head>
  <body>
    <div class="container-fluid">
        <div class="row">
          <div class="col" style="text-align:center; color:#fff; margin-top:30px"><h3>Sistema de Marcação de Consultas da Unidade de Saúde</h3></div>
        </div>
    </div>
    <div class="container">
      <div class="row">
          <div class="col-md-6 offset-md-3 titulo"><h4>Cadastro</h4></div>
      </div>
      <div class="row">
        <div class="col-md-6 offset-md-3 myForm">
 <form class="row g-3 needs-validation"  style="color:#ecf0f1" novalidate >
  <div class="col-md-4">
    <label for="validationDefault01" class="form-label">Nome</label>
    <input type="text" class="form-control" id="validationDefault01" required>
  </div>
  <div class="col-md-4">
    <label for="validationDefault02" class="form-label">Sobrenome</label>
    <input type="text" class="form-control" id="validationDefault02" required>
  </div>
  <div class="col-md-4">
    <label for="validationDefaultUsername" class="form-label">RG</label>
    <div class="input-group">
      <input type="text" class="form-control" id="validationDefaultUsername" aria-describedby="inputGroupPrepend2" required>
    </div>
  </div>
  <div class="col-md-6">
    <label for="validationDefault03" class="form-label">Cidade</label>
    <input type="text" class="form-control" id="validationDefault03" required>
  </div>
  <div class="col-md-3">
    <label for="validationDefault04" class="form-label">Estado</label>
    <select class="form-select" id="validationDefault04" required>
      <option selected value="">Selecione</option>
      <option>Acre</option>
      <option>Bahia</option>
      <option>Ceará</option>
      <option>Maranhão</option>
      <option>Pará</option>
      <option>Piauí</option>
      <option>Paraíba</option>
      
    </select>
  </div>
  <div class="col-md-3">
    <label for="validationDefault05" class="form-label">CEP</label>
    <input type="text" class="form-control" id="validationDefault05" required>
  </div>
  <div class="col-12">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" value="" id="invalidCheck2" required>
      <label class="form-check-label" for="invalidCheck2">Concordo salvar meus dados.</label>
    </div>
  </div>
  <div class="col-12">
    <button type="submit" class="btn btn-lg btn-success">Cadastrar</button>
  </div>
</form>
          <div style="text-align: right">
            <ul>
                <li style="list-style: none"><a href="index.html" class="emFormConf">Já tenho Login.</a></li>
            </ul>
          </div>
          
          
          
          
        </div>
      </div>
    </div>
    <script src="code.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
